<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amber Daily Reset</title>
  <style>
    :root{
      --bg:#fff7fb;
      --card:#ffffff;
      --primary:#e88aa7;
      --primary-dark:#d86b8f;
      --text:#333;
      --muted:#777;
      --success:#40b884;
      --warning:#ffb84d;
      --shadow:0 8px 24px rgba(232,138,167,0.12);
    }

    * { box-sizing: border-box; }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Noto Sans TC",sans-serif;
      background:linear-gradient(180deg,#fff8fb 0%,#fff2f7 100%);
      color:var(--text);
      padding:16px;
    }

    .app{
      max-width:760px;
      margin:0 auto;
    }

    .hero{
      background:linear-gradient(135deg,#ffdbe8 0%,#fff1f7 100%);
      border:1px solid #f7d5e1;
      box-shadow:var(--shadow);
      border-radius:24px;
      padding:18px;
      margin-bottom:18px;
      position:sticky;
      top:8px;
      z-index:10;
    }

    .hero h1{
      margin:0 0 8px;
      font-size:26px;
      color:#c94f79;
    }

    .hero p{
      margin:0;
      color:#7d6170;
      line-height:1.6;
      font-size:14px;
    }

    .quick-summary{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-top:14px;
    }

    .summary-box{
      background:rgba(255,255,255,0.82);
      border:1px solid #f0d3dd;
      border-radius:16px;
      padding:10px;
      text-align:center;
    }

    .summary-box .label{
      font-size:12px;
      color:var(--muted);
      margin-bottom:4px;
    }

    .summary-box .value{
      font-size:18px;
      font-weight:700;
      color:#c94f79;
    }

    .status{
      margin-top:12px;
      padding:10px 12px;
      border-radius:14px;
      font-size:13px;
      line-height:1.5;
      background:#fff;
      border:1px solid #f1dae3;
      color:#734f5f;
    }

    .day-card{
      background:var(--card);
      border:1px solid #f5d9e4;
      border-radius:22px;
      box-shadow:var(--shadow);
      margin-bottom:16px;
      overflow:hidden;
    }

    .today{
      border:2px solid #f3a5be;
    }

    .day-header{
      padding:16px 16px 10px;
      border-bottom:1px solid #f8e5ec;
      background:linear-gradient(180deg,#fffdfd 0%,#fff6fa 100%);
    }

    .date-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
    }

    .date-title{
      font-size:20px;
      font-weight:700;
      color:#c94f79;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      padding:6px 10px;
      font-size:12px;
      font-weight:600;
      background:#fff0f5;
      color:#c94f79;
      border:1px solid #f4d0dc;
    }

    .day-body{
      padding:16px;
    }

    .section{
      margin-bottom:18px;
      padding:14px;
      background:#fffafa;
      border:1px solid #f8e2ea;
      border-radius:18px;
    }

    .section-title{
      font-size:15px;
      font-weight:700;
      margin-bottom:10px;
      color:#6b4d59;
      display:flex;
      align-items:center;
      gap:8px;
    }

    .check-item{
      display:flex;
      align-items:flex-start;
      gap:10px;
      padding:7px 0;
      line-height:1.5;
      color:#444;
    }

    .check-item input[type="checkbox"]{
      width:18px;
      height:18px;
      margin-top:2px;
      accent-color:var(--primary);
      flex-shrink:0;
    }

    .grid-2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .field{
      margin-bottom:10px;
    }

    .field label{
      display:block;
      font-size:13px;
      color:#666;
      margin-bottom:6px;
      font-weight:600;
    }

    input[type="text"],
    input[type="number"]{
      width:100%;
      border:1px solid #ecd6df;
      background:#fff;
      border-radius:14px;
      padding:12px 12px;
      font-size:14px;
      outline:none;
      transition:0.2s ease;
    }

    input[type="text"]:focus,
    input[type="number"]:focus{
      border-color:#e88aa7;
      box-shadow:0 0 0 4px rgba(232,138,167,0.12);
    }

    .exercise-options{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px 12px;
    }

    .pill-check{
      display:flex;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border:1px solid #efd5df;
      border-radius:14px;
      background:#fff;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-top:12px;
    }

    .stat{
      border-radius:16px;
      padding:12px;
      background:#fff;
      border:1px solid #f0dbe3;
      text-align:center;
    }

    .small{
      font-size:12px;
      color:var(--muted);
      margin-bottom:4px;
    }

    .big{
      font-size:18px;
      font-weight:700;
    }

    .green{ color:var(--success); }
    .pink{ color:#d7537d; }
    .orange{ color:#f19a2c; }

    .progress-wrap{
      margin-top:14px;
    }

    .progress-label{
      display:flex;
      justify-content:space-between;
      font-size:13px;
      color:#666;
      margin-bottom:6px;
      font-weight:600;
    }

    .progress{
      height:12px;
      border-radius:999px;
      background:#f8dfe8;
      overflow:hidden;
    }

    .progress-bar{
      height:100%;
      width:0%;
      transition:width 0.3s ease;
      background:linear-gradient(90deg,#f59ab7 0%,#df6f97 100%);
    }

    .card-footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin-top:14px;
      flex-wrap:wrap;
    }

    .save-hint{
      font-size:12px;
      color:#8a7080;
    }

    .small-note{
      color:#8b7180;
      font-size:12px;
      line-height:1.5;
      margin-top:8px;
    }

    @media (max-width:640px){
      body{ padding:12px; }
      .quick-summary,
      .stats,
      .grid-2,
      .exercise-options{
        grid-template-columns:1fr;
      }
      .date-title{ font-size:18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <h1>🌸 Amber Daily Reset</h1>
      <p>6/9 ～ 7/1 減脂同步版｜不用登入，只要同一個網址就會同步。</p>

      <div class="quick-summary">
        <div class="summary-box">
          <div class="label">今天完成率</div>
          <div class="value" id="todayCompletion">0%</div>
        </div>
        <div class="summary-box">
          <div class="label">今天總攝取</div>
          <div class="value" id="todayIntake">0</div>
        </div>
        <div class="summary-box">
          <div class="label">今天淨熱量</div>
          <div class="value" id="todayNet">0</div>
        </div>
      </div>

      <div class="status" id="statusBox">正在同步到雲端…</div>
    </div>

    <div id="container"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      set,
      onValue,
      remove
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBoo-Ql8khcGZjFniI_99kzrxE3pG5f3k",
      authDomain: "daily-reset-a833e.firebaseapp.com",
      databaseURL: "https://daily-reset-a833e-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "daily-reset-a833e",
      storageBucket: "daily-reset-a833e.firebasestorage.app",
      messagingSenderId: "678511296062",
      appId: "1:678511296062:web:064e7b526cab48ba7ddb6f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app, firebaseConfig.databaseURL);

    function sanitizeId(raw) {
      const cleaned = String(raw || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "-")
        .replace(/[^a-z0-9_-]/g, "");
      return cleaned || "amber";
    }

    const params = new URLSearchParams(window.location.search);
    const shareId = sanitizeId(params.get("id") || "amber");

    const startDate = new Date("2026-06-09");
    const endDate = new Date("2026-07-01");
    const weekdayMap = ["日","一","二","三","四","五","六"];
    const todayStr = new Date().toISOString().split("T")[0];

    let recordsStore = {};
    let unsubscribeFn = null;
    const saveTimers = {};

    const container = document.getElementById("container");
    const statusBox = document.getElementById("statusBox");
    const todayCompletionEl = document.getElementById("todayCompletion");
    const todayIntakeEl = document.getElementById("todayIntake");
    const todayNetEl = document.getElementById("todayNet");

    function getSchedule(day) {
      switch(day) {
        case 1: return { text: "18:30-19:30 運動", workoutDay: true };
        case 2: return { text: "12:30-13:30 運動", workoutDay: true };
        case 3: return { text: "插花課｜休息日（新竹日）", workoutDay: false };
        case 4: return { text: "12:30-13:30 或 18:30-19:30 運動", workoutDay: true };
        case 5: return { text: "休息 / 散步", workoutDay: false };
        case 6: return { text: "休息", workoutDay: false };
        case 0: return { text: "休息", workoutDay: false };
        default: return { text: "", workoutDay: false };
      }
    }

    function getDefaultData() {
      return {
        water0900:false,
        water1200:false,
        water1400:false,
        water1600:false,
        sleep0000:false,
        wake0730:false,

        exercise_glutes:false,
        exercise_upper:false,
        exercise_incline:false,
        exercise_walk:false,

        exerciseBurn:"",
        proteinDrink:false,
        proteinKcal:200,

        noLateSnack:false,
        dietControl:false,

        lunchText:"",
        lunchKcal:"",
        dinnerText:"",
        dinnerKcal:"",
        otherText:"",
        otherKcal:""
      };
    }

    function getDateData(dateStr) {
      if (!recordsStore[dateStr]) {
        recordsStore[dateStr] = getDefaultData();
      }
      return recordsStore[dateStr];
    }

    function safeNumber(val) {
      const num = Number(val);
      return isNaN(num) ? 0 : num;
    }

    function hasAnyExercise(data) {
      return Boolean(
        data.exercise_glutes ||
        data.exercise_upper ||
        data.exercise_incline ||
        data.exercise_walk
      );
    }

    function calcIntake(data) {
      const lunch = safeNumber(data.lunchKcal);
      const dinner = safeNumber(data.dinnerKcal);
      const other = safeNumber(data.otherKcal);
      const protein = data.proteinDrink ? safeNumber(data.proteinKcal || 200) : 0;
      return lunch + dinner + other + protein;
    }

    function calcBurn(data) {
      return safeNumber(data.exerciseBurn);
    }

    function calcNet(data) {
      return calcIntake(data) - calcBurn(data);
    }

    function calcCompletion(dateStr) {
      const data = getDateData(dateStr);
      const day = new Date(dateStr).getDay();
      const schedule = getSchedule(day);

      let done = 0;
      let total = 0;

      const checks = [
        data.water0900,
        data.water1200,
        data.water1400,
        data.water1600,
        data.sleep0000,
        data.wake0730,
        data.noLateSnack,
        data.dietControl,
        String(data.lunchText).trim() !== "",
        String(data.dinnerText).trim() !== ""
      ];

      total += checks.length;
      done += checks.filter(Boolean).length;

      if (schedule.workoutDay) {
        total += 2;
        if (hasAnyExercise(data)) done += 1;
        if (data.proteinDrink) done += 1;
      }

      return {
        done,
        total,
        percent: total === 0 ? 0 : Math.round((done / total) * 100)
      };
    }

    function escapeAttr(str = "") {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function updateTodaySummary() {
      const todayData = getDateData(todayStr);
      const completion = calcCompletion(todayStr);
      todayCompletionEl.textContent = `${completion.percent}%`;
      todayIntakeEl.textContent = `${calcIntake(todayData)}`;
      todayNetEl.textContent = `${calcNet(todayData)}`;
    }

    function renderCards() {
      container.innerHTML = "";
      let current = new Date(startDate);

      while (current <= endDate) {
        const dateStr = current.toISOString().split("T")[0];
        const day = current.getDay();
        const weekday = weekdayMap[day];
        const schedule = getSchedule(day);
        const data = getDateData(dateStr);
        const completion = calcCompletion(dateStr);
        const intake = calcIntake(data);
        const burn = calcBurn(data);
        const net = calcNet(data);

        const card = document.createElement("div");
        card.className = "day-card" + (dateStr === todayStr ? " today" : "");

        card.innerHTML = `
          <div class="day-header">
            <div class="date-row">
              <div class="date-title">📅 ${dateStr}（星期${weekday}）</div>
              <div class="tag">${schedule.text}</div>
            </div>
          </div>

          <div class="day-body">
            <div class="section">
              <div class="section-title">💧 喝水目標（2000cc）</div>

              <label class="check-item">
                <input type="checkbox" data-date="${dateStr}" data-field="water0900" ${data.water0900 ? "checked" : ""}>
                <span>09:00 檸檬水 / 喝水 500cc</span>
              </label>

              <label class="check-item">
                <input type="checkbox" data-date="${dateStr}" data-field="water1200" ${data.water1200 ? "checked" : ""}>
                <span>12:00-13:00 喝水 500cc</span>
              </label>

              <label class="check-item">
                <input type="checkbox" data-date="${dateStr}" data-field="water1400" ${data.water1400 ? "checked" : ""}>
                <span>14:00-16:00 喝水 500cc</span>
              </label>

              <label class="check-item">
                <input type="checkbox" data-date="${dateStr}" data-field="water1600" ${data.water1600 ? "checked" : ""}>
                <span>16:00-19:00 喝水 500cc</span>
              </label>
            </div>

            <div class="section">
              <div class="section-title">😴 作息</div>

              <label class="check-item">
                <input type="checkbox" data-date="${dateStr}" data-field="sleep0000" ${data.sleep0000 ? "checked" : ""}>
                <span>00:00 睡覺</span>
              </label>

              <label class="check-item">
                <input type="checkbox" data-date="${dateStr}" data-field="wake0730" ${data.wake0730 ? "checked" : ""}>
                <span>07:30 起床</span>
              </label>
            </div>

            <div class="section">
              <div class="section-title">🏋️ 運動</div>

              <div class="exercise-options">
                <label class="pill-check">
                  <input type="checkbox" data-date="${dateStr}" data-field="exercise_glutes" ${data.exercise_glutes ? "checked" : ""}>
                  <span>重訓 臀腿</span>
                </label>

                <label class="pill-check">
                  <input type="checkbox" data-date="${dateStr}" data-field="exercise_upper" ${data.exercise_upper ? "checked" : ""}>
                  <span>重訓 上半身</span>
                </label>

                <label class="pill-check">
                  <input type="checkbox" data-date="${dateStr}" data-field="exercise_incline" ${data.exercise_incline ? "checked" : ""}>
                  <span>爬坡機</span>
                </label>

                <label class="pill-check">
                  <input type="checkbox" data-date="${dateStr}" data-field="exercise_walk" ${data.exercise_walk ? "checked" : ""}>
                  <span>走路超過 5000 步</span>
                </label>
              </div>

              <div class="grid-2" style="margin-top:12px;">
                <div class="field">
                  <label>運動消耗（kcal）</label>
                  <input type="number" inputmode="numeric" data-date="${dateStr}" data-field="exerciseBurn" value="${escapeAttr(data.exerciseBurn)}" placeholder="例如 250">
                </div>

                <div class="field">
                  <label>Protein Drink 熱量（預設 200 kcal）</label>
                  <input type="number" inputmode="numeric" data-date="${dateStr}" data-field="proteinKcal" value="${escapeAttr(data.proteinKcal)}" placeholder="200">
                </div>
              </div>

              <label class="check-item">
                <input type="checkbox" data-date="${dateStr}" data-field="proteinDrink" ${data.proteinDrink ? "checked" : ""}>
                <span>今天有喝 Protein Drink</span>
              </label>
            </div>

            <div class="section">
              <div class="section-title">🍱 飲食紀錄</div>

              <div class="field">
                <label>中餐吃了什麼</label>
                <input type="text" data-date="${dateStr}" data-field="lunchText" value="${escapeAttr(data.lunchText)}" placeholder="例如：舒肥雞胸＋地瓜＋無糖豆漿">
              </div>

              <div class="field">
                <label>中餐熱量（kcal）</label>
                <input type="number" inputmode="numeric" data-date="${dateStr}" data-field="lunchKcal" value="${escapeAttr(data.lunchKcal)}" placeholder="例如 450">
              </div>

              <div class="field">
                <label>晚餐吃了什麼</label>
                <input type="text" data-date="${dateStr}" data-field="dinnerText" value="${escapeAttr(data.dinnerText)}" placeholder="例如：鮭魚沙拉＋茶葉蛋">
              </div>

              <div class="field">
                <label>晚餐熱量（kcal）</label>
                <input type="number" inputmode="numeric" data-date="${dateStr}" data-field="dinnerKcal" value="${escapeAttr(data.dinnerKcal)}" placeholder="例如 500">
              </div>

              <div class="field">
                <label>其他 / 點心（選填）</label>
                <input type="text" data-date="${dateStr}" data-field="otherText" value="${escapeAttr(data.otherText)}" placeholder="例如：水果、咖啡、餅乾">
              </div>

              <div class="field">
                <label>其他熱量（kcal）</label>
                <input type="number" inputmode="numeric" data-date="${dateStr}" data-field="otherKcal" value="${escapeAttr(data.otherKcal)}" placeholder="例如 120">
              </div>

              <label class="check-item">
                <input type="checkbox" data-date="${dateStr}" data-field="noLateSnack" ${data.noLateSnack ? "checked" : ""}>
                <span>今天沒有吃宵夜</span>
              </label>

              <label class="check-item">
                <input type="checkbox" data-date="${dateStr}" data-field="dietControl" ${data.dietControl ? "checked" : ""}>
                <span>今天有控制飲食</span>
              </label>

              <div class="small-note">
                今日總攝取 = 中餐 + 晚餐 + 其他 + Protein Drink（若有勾選）<br>
                今日淨熱量 = 今日總攝取 - 運動消耗
              </div>
            </div>

            <div class="section">
              <div class="section-title">📊 今日統計</div>

              <div class="stats">
                <div class="stat">
                  <div class="small">總攝取</div>
                  <div class="big pink" id="intake-${dateStr}">${intake} kcal</div>
                </div>
                <div class="stat">
                  <div class="small">運動消耗</div>
                  <div class="big orange" id="burn-${dateStr}">${burn} kcal</div>
                </div>
                <div class="stat">
                  <div class="small">淨熱量</div>
                  <div class="big green" id="net-${dateStr}">${net} kcal</div>
                </div>
              </div>

              <div class="progress-wrap">
                <div class="progress-label">
                  <span>完成率</span>
                  <span id="completion-text-${dateStr}">${completion.done}/${completion.total}（${completion.percent}%）</span>
                </div>
                <div class="progress">
                  <div class="progress-bar" id="progress-${dateStr}" style="width:${completion.percent}%"></div>
                </div>
              </div>

              <div class="card-footer">
                <div class="save-hint">☁️ 自動同步到雲端</div>
                <button class="btn" data-reset="${dateStr}">清空這一天</button>
              </div>
            </div>
          </div>
        `;

        container.appendChild(card);
        current.setDate(current.getDate() + 1);
      }

      updateTodaySummary();
    }

    function updateOneDateUI(dateStr) {
      const data = getDateData(dateStr);
      const intake = calcIntake(data);
      const burn = calcBurn(data);
      const net = calcNet(data);
      const completion = calcCompletion(dateStr);

      const intakeEl = document.getElementById(`intake-${dateStr}`);
      const burnEl = document.getElementById(`burn-${dateStr}`);
      const netEl = document.getElementById(`net-${dateStr}`);
      const completionTextEl = document.getElementById(`completion-text-${dateStr}`);
      const progressEl = document.getElementById(`progress-${dateStr}`);

      if (intakeEl) intakeEl.textContent = `${intake} kcal`;
      if (burnEl) burnEl.textContent = `${burn} kcal`;
      if (netEl) netEl.textContent = `${net} kcal`;
      if (completionTextEl) completionTextEl.textContent = `${completion.done}/${completion.total}（${completion.percent}%）`;
      if (progressEl) progressEl.style.width = `${completion.percent}%`;

      updateTodaySummary();
    }

    async function saveDateRecord(dateStr) {
      const dateRef = ref(db, `shares/${shareId}/dailyResetRecords/${dateStr}`);
      await set(dateRef, {
        ...getDateData(dateStr),
        date: dateStr,
        updatedAt: Date.now()
      });
    }

    function scheduleSave(dateStr) {
      clearTimeout(saveTimers[dateStr]);
      saveTimers[dateStr] = setTimeout(async () => {
        try {
          statusBox.textContent = "正在同步到雲端…";
          await saveDateRecord(dateStr);
          statusBox.textContent = "✅ 已同步";
        } catch (error) {
          console.error(error);
          statusBox.textContent = "❌ 同步失敗，請檢查 Database Rules";
        }
      }, 300);
    }

    function subscribeToRecords() {
      if (typeof unsubscribeFn === "function") {
        unsubscribeFn();
        unsubscribeFn = null;
      }

      const rootRef = ref(db, `shares/${shareId}/dailyResetRecords`);
      unsubscribeFn = onValue(
        rootRef,
        (snapshot) => {
          const data = snapshot.val() || {};
          recordsStore = data;
          renderCards();
          statusBox.textContent = "✅ 已從雲端載入";
        },
        (error) => {
          console.error(error);
          statusBox.textContent = "❌ 無法讀取資料，請檢查 Database Rules";
        }
      );
    }

    function handleFieldUpdate(el) {
      const dateStr = el.dataset.date;
      const field = el.dataset.field;
      if (!dateStr || !field) return;

      const data = getDateData(dateStr);

      if (el.type === "checkbox") {
        data[field] = el.checked;
      } else {
        data[field] = el.value;
      }

      updateOneDateUI(dateStr);
      scheduleSave(dateStr);
    }

    async function resetDate(dateStr) {
      try {
        const dateRef = ref(db, `shares/${shareId}/dailyResetRecords/${dateStr}`);
        await remove(dateRef);
        delete recordsStore[dateStr];
        renderCards();
        statusBox.textContent = `✅ 已清空 ${dateStr}`;
      } catch (error) {
        console.error(error);
        statusBox.textContent = "❌ 清空失敗";
      }
    }

    document.addEventListener("input", (e) => {
      const target = e.target;
      if (target.matches("input[data-date]")) {
        handleFieldUpdate(target);
      }
    });

    document.addEventListener("change", (e) => {
      const target = e.target;
      if (target.matches("input[type='checkbox'][data-date]")) {
        handleFieldUpdate(target);
      }
    });

    document.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-reset]");
      if (!btn) return;
      const dateStr = btn.dataset.reset;
      if (confirm(`要清空 ${dateStr} 的記錄嗎？`)) {
        resetDate(dateStr);
      }
    });

    renderCards();
    subscribeToRecords();
  </script>
</body>
</html>
