<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>🌸 Amber Fat Loss Plan 🌸</title>
<style>
  body {
    font-family: Arial;
    background: #f6f6f6;
    padding: 20px;
  }
  .card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  input[type="text"] {
    width: 90%;
    padding: 5px;
    margin: 5px 0;
  }
</style>
</head>

<body>

<h1>🌸 Amber’s Daily Reset 🌸</h1>

<div id="container"></div>

<script>
const startDate = new Date("2026-06-09");
const endDate = new Date("2026-07-01");

function getSchedule(day) {
  switch(day) {
    case 1: return "18:30-19:30 運動";
    case 2: return "12:30-13:30 運動";
    case 3: return "插花課｜休息";
    case 4: return "運動（12:30 或 18:30）";
    case 5: return "休息 / 散步";
    case 6:
    case 0: return "休息";
  }
}

let current = new Date(startDate);

while (current <= endDate) {
  let day = current.getDay();
  let dateStr = current.toISOString().split("T")[0];

  let card = `
  <div class="card">
    <h2>${dateStr}（${["日","一","二","三","四","五","六"][day]}）</h2>

    <p>📅 今日安排：${getSchedule(day)}</p>

    <b>✅ Daily Reset</b><br>
    <label><input type="checkbox"> 09:00 喝水 500cc</label><br>
    <label><input type="checkbox"> 12:00-13:00 喝水 500cc</label><br>
    <label><input type="checkbox"> 14:00-16:00 喝水 500cc</label><br>
    <label><input type="checkbox"> 16:00-19:00 喝水 500cc</label><br><br>

    <b>🏋️ 運動</b><br>
    <label><input type="checkbox"> 重訓（臀腿）</label>
    <label><input type="checkbox"> 重訓（上半身）</label>
    <label><input type="checkbox"> 爬坡機</label>
    <label><input type="checkbox"> 步行 >5000</label><br>
    消耗：<input type="text" placeholder="kcal"><br><br>

    <label><input type="checkbox"> 運動後喝 Protein Drink</label><br>
    <label><input type="checkbox"> 今天沒有吃宵夜</label><br><br>

    <b>🍱 飲食紀錄</b><br>
    中餐：<input type="text" placeholder="今天吃了什麼"><br>
    晚餐：<input type="text" placeholder="今天吃了什麼"><br>

    <p>🔥 Keep Going</p>
  </div>
  `;

  document.getElementById("container").innerHTML += card;
  current.setDate(current.getDate() + 1);
}
</script>

</body>
</html>
